<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — myDepo</title>
    <meta name="robots" content="noindex"/>
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg"/>
    <link href="/css/fonts.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&subset=cyrillic" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Open Sans', sans-serif;
            color: #383838;
            background: #fff;
            padding: 20px;
            box-sizing: border-box;
        }

        .wrap {
            text-align: center;
            max-width: 520px;
        }

        .wrap img {
            width: 150px;
            margin-bottom: 40px;
        }

        .code {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            color: #1c2f81;
            margin: 0 0 16px;
        }

        .wrap p {
            font-size: 18px;
            line-height: 1.5;
            margin: 0 0 8px;
        }

        .wrap p.ru {
            opacity: 0.6;
            margin-bottom: 32px;
        }

        .wrap a {
            display: inline-block;
            padding: 14px 32px;
            background: #ED8661;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <a href="/" style="background:none;padding:0"><img src="/img/logo.svg" alt="myDepo"></a>
    <p class="code">404</p>
    <p>Pagina nu a fost găsită.</p>
    <p class="ru">Страница не найдена.</p>
    <a href="/">Spre pagina principală / На главную</a>
</div>
</body>
</html>
